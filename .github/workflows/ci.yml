name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Path filters on pull requests (the `changes` job): a PR that changes only ui/ skips the Rust
# jobs, and one that changes nothing in ui/ or the shared files skips the UI jobs. Shared files
# run both: the workflows, the root manifests, the engine (all of src/, compiled into the WASM the
# UI and the app run), the session contract (docs/open.md, docs/session.md), the app job's fixture and
# the WASM crate. Pushes to main and manual runs run everything; releases run release.yml. A
# skipped job is not a failure: `ci-ok` is the one check branch protection requires.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # the PR's base and head, for the files it changes
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" != pull_request ]; then
            echo "Not a pull request: everything runs."
            printf 'rust=true\nui=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rust=false
          ui=false
          # The files the PR changes (since it left its base).
          files=$(git diff --name-only "$BASE...$HEAD")
          while IFS= read -r file; do
            case "$file" in
              '') ;;
              ui/*) ui=true ;;
              # The engine (src/) is compiled into the WASM the UI and the app run, so an engine
              # change is tested by the ui and app jobs too. Only a ui-only change skips Rust.
              .github/*|Cargo.toml|Cargo.lock|build.rs|tools/open_smoke.py|tests/fixtures/bundle/*|rust-toolchain.toml|docs/open.md|docs/session.md|src/*|tests/fixtures/thread-depth-alpha7.step.gz|crates/specify-core-wasm/*)
                rust=true; ui=true ;;
              *) rust=true ;;
            esac
          done <<< "$files"
          echo "rust=$rust ui=$ui"
          printf 'rust=%s\nui=%s\n' "$rust" "$ui" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity-corpus
      SPECIFY_CORPUS: ${{ github.workspace }}/quiddity-corpus
      QUIDDITY_CORPUS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Same corpus repository and revision as pzfreo/quiddity's suite.yml (pzfreo/quiddity-corpus,
      # split from the retired Python repository's tests/corpus; identical at 6d544e0).
      # Tests select Specify's regressions from tests/common/corpus.rs; the full sweep
      # is a local opt-in (SPECIFY_CORPUS_ALL=1), not a CI tier.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: quiddity-corpus
      # The toolchain comes from rust-toolchain.toml. pzfreo/quiddity is a public git dependency,
      # pinned by Cargo.lock.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: STEP diff comment regression
        if: runner.os == 'Linux'
        run: bash step-diff/tests/comment.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      # Maintainer decision, 2026-10-26: macOS PRs build and run only float-sensitive
      # expectations; five macOS runners are shared across repos, so reduce runner-minutes
      # rather than add jobs/shards. Linux always runs everything. Main, dispatch and
      # release* PR heads retain the full macOS suite.
      - name: Build the workspace and every test
        run: cargo test --workspace --release --locked --no-run
      - name: Full suite
        if: runner.os != 'macOS' || github.event_name != 'pull_request' || startsWith(github.head_ref, 'release')
        run: cargo test --workspace --release --locked --no-fail-fast
      - name: macOS PR floating-point checks
        if: runner.os == 'macOS' && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release')
        # features: libm-dependent frame/recognition and rounded face records.
        # mesh: acos/sin, UV refinement, triangle winding/area and rounded bounds.
        # anchors: geometric integration and six-decimal leader positions/directions.
        # schema6: rotated slot end planes, frame roll and PMI coordinates.
        # resume: rounded centroids, signed zero and persisted fingerprint hashes.
        # revision: geometric correspondence, rounded report measurements and PNG projection.
        # characteristic_numbers: macOS-captured legacy serialization hashes.
        # pyfmt: exact binary rounding/formatting used by all these expectations.
        run: >-
          cargo test --release --locked --no-fail-fast
          --test features --test mesh --test anchors --test schema6
          --test resume --test revision --test pyfmt --test characteristic_numbers

  # The engine. Its build also feeds the UI jobs, so it runs for either; its own checks (API
  # snapshot, size, parity, the npm pack) only when Rust-side files changed.
  wasm:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_CHECKS: ${{ needs.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # API acknowledgement is compared with the PR base / previous push.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - if: env.RUST_CHECKS == 'true'
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: wasm-pack build crates/specify-core-wasm --target web --profile wasm-release --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-pkg
          path: crates/specify-core-wasm/pkg
          if-no-files-found: error
      - name: Check WASM API snapshot and changelog
        if: env.RUST_CHECKS == 'true'
        env:
          API_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          if [ -z "$API_BASE" ] || [ "$API_BASE" = "0000000000000000000000000000000000000000" ]; then
            API_BASE=$(git hash-object -t tree -w --stdin < /dev/null)
          fi
          python3 tools/check_wasm_api.py --base-ref "$API_BASE"
      - if: env.RUST_CHECKS == 'true'
        run: python3 tools/wasm_size.py
      - name: The npm package packs (release.yml publishes it)
        if: env.RUST_CHECKS == 'true'
        run: |
          cp -R crates/specify-core-wasm/pkg "$RUNNER_TEMP/npm-pkg"
          cp NOTICE "$RUNNER_TEMP/npm-pkg/NOTICE" # as release.yml does before archiving
          python3 tools/npm_package.py "$RUNNER_TEMP/npm-pkg" --check-pack
      - name: Compare released editor kernel (advisory)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check_quiddity_pin.py
      - if: env.RUST_CHECKS == 'true'
        run: cargo build --locked --release -p specify-core-wasm --example parity_reference
      - if: env.RUST_CHECKS == 'true'
        run: node scripts/wasm-parity.mjs
      - if: env.RUST_CHECKS == 'true'
        run: node scripts/wasm-face-names.mjs
      - if: env.RUST_CHECKS == 'true'
        run: node scripts/wasm-answers-export.mjs
      - if: env.RUST_CHECKS == 'true'
        run: node scripts/wasm-limits.mjs
      - if: env.RUST_CHECKS == 'true'
        run: node scripts/wasm-hostile.mjs

  # The UI (ui/): the library's suites on the WASM built above, as specify-ui's own CI ran them.
  ui:
    needs: [changes, wasm]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: crates/specify-core-wasm/pkg
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The engine dependency is the in-repo build (file:../crates/specify-core-wasm/pkg).
      - run: npm ci
      - name: Install the in-repo engine into public/wasm/intent
        run: npm run fetch:wasm
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:app
      - run: npm test
      # Keyed on the lockfile, which pins @playwright/test and so the browser build.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Test the packed tarball in a host app
        run: npm run test:package
      - name: Show the package contents
        run: npm pack --dry-run

  # The local app (ui/app) built into the specify-core command from the same commit (ADR P12):
  # `open` by hand and `mcp`'s `show` as an agent (test/app-browser.mjs, test/app-agent.mjs),
  # served from the command itself.
  app:
    needs: [changes, wasm]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: crates/specify-core-wasm/pkg
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run fetch:wasm
        working-directory: ui
      - run: npm run build:app
        working-directory: ui
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: app-cli
      # build.rs builds in ui/dist-app and the WASM; SPECIFY_REQUIRE_BUNDLE fails rather than
      # leave either out.
      - name: Build the specify-core command with the app and engine
        env:
          SPECIFY_REQUIRE_BUNDLE: '1'
        run: |
          cargo build --release --locked --bin specify-core
          echo "SPECIFY_CORE=$PWD/target/release/specify-core" >> "$GITHUB_ENV"
      - name: Open serves the built-in app and engine
        run: |
          gunzip -c tests/fixtures/thread-depth-alpha7.step.gz > "$RUNNER_TEMP/part.step"
          python3 tools/open_smoke.py "$SPECIFY_CORE" "$RUNNER_TEMP/part.step"
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: The app against `specify-core open` and `mcp`, served from the command
        working-directory: ui
        env:
          SPECIFY_APP_BUILT_IN: '1'
        run: node test/app-browser.mjs && node test/app-agent.mjs

  # The one required check: passes when every job above passed or was skipped by the path
  # filter, fails when any failed or was cancelled.
  ci-ok:
    needs: [changes, test, wasm, ui, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A CI job ended $result."; exit 1 ;;
            esac
          done
