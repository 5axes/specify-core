name: Python package

# The specify-core Python package (crates/specify-core-py): an abi3 wheel per platform and an
# sdist, each carrying the app and engine bundle.yml builds first (ADR P12). Each wheel is
# installed, checked to serve its built-in app (tools/open_smoke.py), and its smoke suite
# (tests/python) run on CPython 3.12, and the
# Linux x86_64 wheel on the oldest (3.11) and newest CPython too, as abi3 promises. Published to PyPI for a
# release. A change to the package, the engine or this workflow builds and tests on its pull
# request, without publishing.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'crates/specify-core-py/**'
      - 'tests/python/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'tools/open_smoke.py'
      - '.github/workflows/python.yml'
      - '.github/workflows/bundle.yml'
  # A manual run on main can publish the version already released (0.1.4 predates this workflow).
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built wheels and sdist to PyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bundle:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/bundle.yml
    with:
      ref: ${{ github.event.release.tag_name || github.sha }}

  wheels:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64, manylinux: '2_28' }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: '2_28' }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      # rustc's thin-LTO threads overflow Windows' default stack on step-io (as cli.yml).
      RUST_MIN_STACK: '67108864'
      # build.rs fails rather than build a wheel without the app and engine (as cli.yml).
      SPECIFY_REQUIRE_BUNDLE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      # The app and engine build.rs builds in (bundle/app, bundle/wasm).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: specify-bundle
          path: bundle
      # The package's LICENSE and NOTICE are links to the repository's; a Windows checkout
      # makes a link a text file holding its target, so it gets the files themselves.
      - if: runner.os == 'Windows'
        run: |
          rm crates/specify-core-py/LICENSE crates/specify-core-py/NOTICE
          cp LICENSE NOTICE crates/specify-core-py/
      # The toolchain comes from rust-toolchain.toml.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # The manylinux builds run in Docker, which does not inherit the job's environment.
          docker-options: -e SPECIFY_REQUIRE_BUNDLE=1
          args: --release --locked -m crates/specify-core-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  # The sdist carries bundle/ too, so a build from it has the app and engine built in.
  sdist:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: specify-bundle
          path: bundle
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: -m crates/specify-core-py/Cargo.toml --out dist
      - name: The sdist carries the app and engine
        run: |
          set -eu
          names=$(tar -tzf dist/*.tar.gz)
          for file in bundle/app/index.html bundle/app/specify-ui-app.json bundle/wasm/specify_core_wasm.js bundle/wasm/specify_core_wasm_bg.wasm bundle/wasm/package.json; do
            grep -q "/$file\$" <<<"$names" || { echo "::error::the sdist lacks $file"; exit 1; }
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, python: '3.12' }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, python: '3.12' }
          - { name: macos-arm64, os: macos-latest, python: '3.12' }
          - { name: macos-x86_64, os: macos-15-intel, python: '3.12' }
          - { name: windows-x64, os: windows-latest, python: '3.12' }
          # The abi3 wheel on the oldest and the newest CPython.
          - { name: linux-x86_64, os: ubuntu-22.04, python: '3.11' }
          - { name: linux-x86_64, os: ubuntu-22.04, python: '3.15' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv venv --python ${{ matrix.python }} .venv
      - name: Install the wheel, and pytest
        run: |
          uv pip install --python .venv pytest jsonschema
          # --no-cache: a cached wheel of the same version would hide this build.
          uv pip install --python .venv --no-index --no-cache --find-links dist specify-core
      - name: The wheel carries the licence
        run: |
          .venv/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/python - <<'EOF'
          import glob, zipfile
          (wheel,) = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          for name in ("LICENSE", "NOTICE"):
              (found,) = [n for n in names if n.endswith(".dist-info/licenses/" + name)]
              text = zipfile.ZipFile(wheel).read(found).decode()
              assert len(text) > 100, (found, text)
          EOF
      # Its own app and engine, served with no download (no --app, an empty HOME, no proxy).
      - name: The wheel's command serves its built-in app and engine
        run: |
          gunzip -c tests/fixtures/thread-depth-alpha7.step.gz > part.step
          bin=.venv/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}
          "$bin/python" tools/open_smoke.py "$bin/specify-core${{ runner.os == 'Windows' && '.exe' || '' }}" part.step
      - run: .venv/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/python -m pytest tests/python -q

  publish:
    needs: [wheels, sdist, test]
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
      actions: read # the CI gate below reads ci.yml's runs
    steps:
      # ci.yml's push run on main tests the app against the built-in one; a commit it has not
      # passed is not released (as crates.yml). github.sha is the tagged commit for a release.
      - name: ci.yml passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          sha=${{ github.sha }}
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&status=success&event=push" --jq .total_count)
          if [ "$n" -lt 1 ]; then
            echo "::error::ci.yml has no successful run for $sha ($TAG): publish refused"
            exit 1
          fi
      # The wheels and the sdist only (not specify-bundle, which they carry).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
