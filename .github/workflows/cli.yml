name: Release command line

# The specify-core command line for Linux, macOS and Windows, attached to each release. Each
# binary carries the app and engine bundle.yml builds first (ADR P12). A change to this workflow,
# bundle.yml or build.rs builds and tries all three on its pull request, without attaching anything.
on:
  release:
    types: [published]
  pull_request:
    paths: ['.github/workflows/cli.yml', '.github/workflows/bundle.yml', 'build.rs', 'tools/open_smoke.py']

permissions:
  contents: read

jobs:
  bundle:
    if: github.event_name == 'pull_request' || startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/bundle.yml
    with:
      ref: ${{ github.event.release.tag_name || github.sha }}

  build:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, exe: '' }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: .exe }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      # build.rs fails rather than build a binary without the app and engine.
      SPECIFY_REQUIRE_BUNDLE: '1'
      # rustc's thin-LTO threads overflow Windows' default stack on step-io.
      RUST_MIN_STACK: '67108864'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: specify-bundle
          path: bundle
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cli-${{ matrix.target }}
      - name: Install Linux cross-linker
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          python3 -m pip install --user ziglang==0.17.0
          cargo install cargo-zigbuild --version 0.23.4 --locked
      - name: Build Linux for glibc 2.28
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        # The glibc suffix selects the link baseline, not the artifact directory/name.
        run: cargo zigbuild --locked --release --bin specify-core --target x86_64-unknown-linux-gnu.2.28
      - if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo build --locked --release --bin specify-core --target ${{ matrix.target }}
      - name: Check Linux glibc requirements
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          highest=$(objdump -T target/${{ matrix.target }}/release/specify-core | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' | sort -Vu | tail -n 1)
          echo "Highest required glibc symbol version: $highest"
          test -n "$highest"
          test "$(printf '%s\n' "$highest" GLIBC_2.28 | sort -V | tail -n 1)" = GLIBC_2.28
      - name: Try it on a revision
        # The spindle pair: the two files' PMI compared, by characteristic number, no answers.
        run: |
          bin="target/${{ matrix.target }}/release/specify-core${{ matrix.exe }}"
          fixtures=tests/fixtures/revisions
          printed=$("$bin" diff $fixtures/spindle_pmi.old.step.gz $fixtures/spindle_pmi.new.step.gz -o smoke)
          echo "$printed"
          echo "$printed" | grep -q '"verdict": *"ok"'
          cat smoke/report.md
          grep -q '^- #13 ' smoke/report.md && grep -q '^- #16 added' smoke/report.md
          test ! -e smoke/answers.json
      # Its own app and engine, served with no download (no --app, an empty HOME, no proxy).
      - name: Open serves the built-in app and engine
        run: |
          gunzip -c tests/fixtures/thread-depth-alpha7.step.gz > part.step
          py=python3; [ "${{ runner.os }}" != Windows ] || py=python
          "$py" tools/open_smoke.py "target/${{ matrix.target }}/release/specify-core${{ matrix.exe }}" part.step
      - name: Try Linux on Amazon Linux 2023 and AlmaLinux 8
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          for image in amazonlinux:2023 almalinux:8; do
            docker run --rm -i --volume "$PWD:/work:ro" --workdir /work "$image" bash -euo pipefail -s <<'SMOKE'
          bin=target/x86_64-unknown-linux-gnu/release/specify-core
          "$bin" --help
          fixtures=tests/fixtures/revisions
          printed=$("$bin" diff "$fixtures/spindle_pmi.old.step.gz" "$fixtures/spindle_pmi.new.step.gz" -o /tmp/smoke)
          echo "$printed"
          echo "$printed" | grep -q '"verdict": *"ok"'
          grep -q '^- #13 ' /tmp/smoke/report.md
          test ! -e /tmp/smoke/answers.json
          SMOKE
          done
      - name: Package and checksum
        run: |
          name="specify-core-${RELEASE_TAG:-pr}-${{ matrix.target }}"
          mkdir -p dist "$name"
          cp "target/${{ matrix.target }}/release/specify-core${{ matrix.exe }}" LICENSE README.md "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            asset="$name.zip"; 7z a -bd "dist/$asset" "$name" > /dev/null
          else
            asset="$name.tar.gz"; tar -czf "dist/$asset" "$name"
          fi
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum "$asset"; else shasum -a 256 "$asset"; fi > "$asset.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Only this job can write to the repository or sign, and only for a release. It attests the
  # archives' build provenance (`gh attestation verify <archive> --repo pzfreo/specify-core`):
  # with the app and engine inside the binary (ADR P12), that covers them too.
  attach:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # the attestation's signing certificate
      attestations: write
      actions: read # the CI gate below reads ci.yml's runs
    steps:
      # ci.yml's push run on main tests the app against the built-in one; a commit it has not
      # passed is not released (as crates.yml). github.sha is the tagged commit for a release.
      - name: ci.yml passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          sha=${{ github.sha }}
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&status=success&event=push" --jq .total_count)
          if [ "$n" -lt 1 ]; then
            echo "::error::ci.yml has no successful run for $sha ($TAG): publish refused"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Attach to this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
