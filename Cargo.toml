[workspace]
members = ["crates/specify-core-wasm", "crates/specify-core-py"]
default-members = ["."]
resolver = "3"

[package]
name = "specify-core"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
description = "Interview-driven AP242 PMI authoring for STEP parts (Rust port of specify-core)"
repository = "https://github.com/pzfreo/specify-core"
readme = "README.md"
# crates.io gets the library and the command line; tests, fixtures and tools stay in the repository.
include = ["/src/**", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[[bin]]
name = "specify-core"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command line (src/cli.rs, the binary and the Python console script). The WASM build
# turns it off so the parser and release asset downloader stay out of the browser bundle.
cli = ["dep:clap", "dep:clap_complete", "dep:dirs", "dep:tar", "dep:tempfile", "dep:ureq"]
# Enables the subprocess fixture's loopback release source during cargo test only.
asset-test-hooks = []

[dependencies]
# The command line's parser, and its shell completion scripts (`specify-core completions`).
clap = { version = "4.6.1", features = ["derive"], optional = true }
clap_complete = { version = "4.6", optional = true }
# First-run downloads for `open` and MCP `show`.
dirs = { version = "6.0.0", optional = true }
tar = { version = "0.4.46", default-features = false, optional = true }
tempfile = { version = "3.27.0", optional = true }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"], optional = true }
# pzfreo/quiddity: feature recognition (quiddity) and the geometry kernel with STEP import and
# AP242 semantic PMI (haecceity). Both use release tag v0.5.4.
# See docs/design.md, "Dependency plan".
quiddity = { version = "=0.5.4", git = "https://github.com/pzfreo/quiddity", tag = "v0.5.4", default-features = false, features = ["presentation"] }
haecceity = { version = "=0.5.4", git = "https://github.com/pzfreo/quiddity", tag = "v0.5.4", features = ["json"] }
# The kernel's own unit reader also converts planner supplemental points into file units.
step-io = "0.3.0"
base64 = "0.22.1"
# Gzipped STEP input is decompressed in memory, and a `.gz` destination written gzipped.
flate2 = "1.1.10"
# Overlap area of two facing flat faces (mates::contacts): haecceity has no face boolean yet
# (upstream need U5), so the faces' boundaries are intersected as polygons with holes.
i_overlay = "8.1.2"
# specify-core reads typed specs and added requirements with regular expressions (choices, extras).
regex = "1.11.1"
# The revision picture (revision.rs) is written as a PNG.
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: objects keep their insertion order, as Python's dicts do, so the JSON formats
# read in the same order as specify-core's.
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.0"
# Constrained Delaunay triangulation of faces in their parameter space (triangulate.rs, the
# stand-in for haecceity face meshing, upstream need U4).
spade = "2.15.1"

[dev-dependencies]
flate2 = "1.1.10"
specify-core = { path = ".", default-features = false, features = ["asset-test-hooks"] }

[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 1
opt-level = 3
