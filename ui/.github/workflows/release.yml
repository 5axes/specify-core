name: Release

# Runs only when a GitHub release is published (created by Paul). The build job checks the
# tag against package.json and the WASM pin, then runs the CI suites and packs the tarball.
# The app job, separately, builds the local app (specify-ui-app-<version>.tgz) and runs its tests
# against the specify-core command engines.lock.json pins (sha256 pinned there too); the
# app-assets job, after build and app, attests the app archive's build provenance and attaches it
# to the release. The npm library never waits on the app: an app that cannot be tested (a pinned
# specify-core without the session contract) attaches nothing, and the library still publishes.
# The publish job waits for approval in the `npm` environment and publishes that tarball
# with npm trusted publishing (OIDC): configured on npmjs.com for this repo, release.yml and
# environment `npm`. The workflow passes no npm token, so every publish goes through the
# trusted publisher (the token-based first publish, v0.1.0, is done).
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0 # main's history, to check the tag is on it
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - name: Release guard
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -u
          fail=0
          err() { echo "::error::$1"; fail=1; }
          # As in specify-core: a GitHub release marked pre-release is never published to npm.
          if [ "$PRERELEASE" != false ]; then
            err "Release $TAG is marked as a pre-release: not published to npm."
          fi
          pkg_version=$(node -p "require('./package.json').version")
          wasm_version=$(node -p "require('./package.json').dependencies?.['@draftwright/specify-core-wasm'] ?? ''")
          intent_tag=$(node -p "require('./engines.lock.json').intent.tag")
          lock_resolved=$(node -p "require('./package-lock.json').packages['node_modules/@draftwright/specify-core-wasm']?.resolved ?? ''")

          # A release on a v* tag whose commit is on main, never a branch or a stray commit.
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) err "The release ref is $GITHUB_REF, not a v* tag." ;;
          esac
          commit=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)
          if [ -z "$commit" ]; then
            err "Tag $TAG is not in the checkout."
          elif ! git merge-base --is-ancestor "$commit" origin/main; then
            err "Tag $TAG ($commit) is not on main."
          fi

          if [ "$TAG" != "v$pkg_version" ]; then
            err "Tag $TAG does not match package.json version v$pkg_version."
          fi

          if ! printf '%s' "$wasm_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            err "package.json dependency @draftwright/specify-core-wasm must be an exact version (found '$wasm_version')."
          elif [ "$wasm_version" != "${intent_tag#v}" ]; then
            err "@draftwright/specify-core-wasm $wasm_version in package.json does not match engines.lock.json intent.tag $intent_tag."
          else
            published=$(npm view "@draftwright/specify-core-wasm@$wasm_version" version 2>/dev/null || true)
            if [ "$published" != "$wasm_version" ]; then
              err "@draftwright/specify-core-wasm@$wasm_version is not published on npm. Publish the WASM package first."
            fi
          fi

          case "$lock_resolved" in
            https://registry.npmjs.org/*) ;;
            *) err "package-lock.json resolves @draftwright/specify-core-wasm from '$lock_resolved', not https://registry.npmjs.org/. Refresh the lockfile from the registry and test it before releasing." ;;
          esac

          exit "$fail"
      - name: Cache upstream release archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/wasm-releases
          key: wasm-releases-${{ hashFiles('engines.lock.json') }}
      - name: Fetch the pinned Specify WASM
        run: npm run fetch:wasm
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The engine on npm must be the release engines.lock.json pins: the same .wasm and glue as its
      # checksum-verified specify-core release asset (fetched above into public/wasm/intent), and the
      # tarball the lockfile (and so these tests) installed. The npm tarball itself differs from the
      # GitHub asset by construction (its package.json is the scoped package's), so the files are compared.
      - name: The engine on npm is the pinned release
        run: |
          set -eu
          version=$(node -p "require('./package.json').dependencies['@draftwright/specify-core-wasm']")
          registry=$(npm view "@draftwright/specify-core-wasm@$version" dist.integrity)
          locked=$(node -p "require('./package-lock.json').packages['node_modules/@draftwright/specify-core-wasm'].integrity")
          [ "$registry" = "$locked" ] || { echo "::error::The registry's integrity ($registry) is not the lockfile's ($locked)."; exit 1; }
          dir=$(mktemp -d)
          npm pack "@draftwright/specify-core-wasm@$version" --pack-destination "$dir" >/dev/null
          tar -xzf "$dir"/*.tgz -C "$dir"
          for file in specify_core_wasm_bg.wasm specify_core_wasm.js; do
            a=$(sha256sum "$dir/package/$file" | cut -d' ' -f1)
            b=$(sha256sum "public/wasm/intent/$file" | cut -d' ' -f1)
            [ "$a" = "$b" ] || { echo "::error::$file on npm ($a) is not the pinned release's ($b)."; exit 1; }
          done
          echo "@draftwright/specify-core-wasm@$version matches the pinned release."
      - run: npm run build
      - run: npm test
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:package
      # --ignore-scripts: prepack would rebuild; the tarball must hold the build that was tested.
      - name: Pack the tarball
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: "*.tgz"
          if-no-files-found: error

  # The local app `specify-core open` serves (app/): built, tested against the pinned specify-core
  # command, and packed. Only app-assets needs it, so the npm library's publish never waits on it.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - name: Cache upstream release archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/wasm-releases
          key: wasm-releases-${{ hashFiles('engines.lock.json') }}
      - name: Fetch the pinned Specify WASM
        run: npm run fetch:wasm
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The app's tests (test/app-browser.mjs, test/app-agent.mjs) need the specify-core command
      # that serves it: the Linux binary of the specify-core release engines.lock.json pins (the
      # release whose WASM the app runs), checked against the sha256 pinned in engines.lock.json
      # (`command`), not against the release's own .sha256 file.
      - name: Fetch the pinned specify-core command
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          repo=$(node -p "require('./engines.lock.json').command.repository")
          tag=$(node -p "require('./engines.lock.json').command.tag")
          intent_tag=$(node -p "require('./engines.lock.json').intent.tag")
          asset=$(node -p "require('./engines.lock.json').command.assets['x86_64-unknown-linux-gnu'].asset")
          sha=$(node -p "require('./engines.lock.json').command.assets['x86_64-unknown-linux-gnu'].sha256")
          [ "$tag" = "$intent_tag" ] || { echo "::error::engines.lock.json pins the command at $tag but the WASM at $intent_tag: pin the same specify-core release."; exit 1; }
          mkdir -p .cache/specify-core
          cd .cache/specify-core
          gh release download "$tag" --repo "$repo" --pattern "$asset"
          echo "$sha  $asset" | sha256sum -c -
          tar -xzf "$asset"
          bin=$(find "$PWD" -type f -name specify-core -perm -u+x | head -1)
          [ -n "$bin" ] || { echo "::error::$asset has no specify-core binary."; exit 1; }
          echo "SPECIFY_CORE=$bin" >> "$GITHUB_ENV"
      # The app needs the command's session contract (`open` serving the app, `GET answers`,
      # `PUT answers`, `POST save {rev}`; specify-core docs/open.md). A pin without it fails here,
      # by name: no app is attached to this release; the npm library is published regardless.
      - name: The pinned specify-core serves the app
        run: |
          set -eu
          tag=$(node -p "require('./engines.lock.json').command.tag")
          if ! "$SPECIFY_CORE" open --help | grep -q -- '--in-place'; then
            echo "::error::specify-core $tag (engines.lock.json) has no session contract (open serving the app, GET/PUT answers, POST save {rev}): the local app is not tested or attached to this release. The npm library is published without it. Pin a specify-core release with the session contract to release the app."
            exit 1
          fi
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # build:app, then the app against `specify-core open` and `mcp`; the archive below is that build.
      - name: Test the local app
        run: |
          npm run test:app || {
            echo "::error::The local app's tests failed against specify-core $(node -p "require('./engines.lock.json').command.tag"): no app is attached to this release (the npm library is published without it)."
            exit 1
          }
      # Its files and API manifest at the archive's root, with its sha256.
      - name: Pack the local app
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          mkdir app-release
          tar -czf "app-release/specify-ui-app-$version.tgz" -C dist-app .
          # Refuse an app archive without its root manifest (or with different contents).
          tar -xOzf "app-release/specify-ui-app-$version.tgz" ./specify-ui-app.json | cmp dist-app/specify-ui-app.json -
          (cd app-release && sha256sum "specify-ui-app-$version.tgz" > "specify-ui-app-$version.tgz.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release
          path: app-release/*
          if-no-files-found: error

  # Attests the local app's build provenance and attaches it to the GitHub release. Only this job
  # can write to the repository (contents: write, for the release's assets) or sign (id-token and
  # attestations, for the attestation); it checks out nothing and runs no package code.
  app-assets:
    # build too: its release guard (tag on main, matching package.json) holds for the app as well.
    needs: [build, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # the attestation's signing certificate
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-release
          path: app-release
      # `gh attestation verify specify-ui-app-<version>.tgz --repo pzfreo/specify-ui` checks it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app-release/*.tgz
      # An asset already on the release is never replaced: the upload fails instead.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          cd app-release
          sha256sum -c ./*.sha256
          gh release upload "$TAG" ./*.tgz ./*.sha256 --repo "$REPO"

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: tarball
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11.20.0
      # npm exchanges the job's OIDC token with the trusted publisher; no secret is used.
      - name: Publish
        run: |
          set -eu
          set -- ./tarball/*.tgz
          [ "$#" -eq 1 ] || { echo "::error::Expected one tarball, found $#."; exit 1; }
          file=$1 # ./ prefix: npm reads a bare "dir/file.tgz" as a GitHub owner/repo
          version=$(tar -xOzf "$file" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          # As in specify-core: `latest` never moves backwards. A version older than npm's latest
          # is published under release-<version>; a semver prerelease version (1.0.0-rc.1) under
          # `next`; the package not existing yet (first publish) means `latest`.
          latest=$(npm view "@draftwright/specify-ui" dist-tags.latest 2>/dev/null || true)
          case "$version" in
            *-*) dist_tag=next ;;
            *)
              if [ -n "$latest" ] && [ "$(printf '%s\n' "$latest" "$version" | sort -V | tail -1)" != "$version" ]; then
                dist_tag="release-$version"
              else
                dist_tag=latest
              fi
              ;;
          esac
          echo "Publishing $version with dist-tag $dist_tag (npm latest: ${latest:-none})"
          npm publish "$file" --provenance --access public --tag "$dist_tag"
